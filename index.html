<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taklimda Mobile - Koreksi Absen</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
    window.getValPeka = function(obj, targetKeys) {
        if (!obj || typeof obj !== 'object') return '';
        const normalizedMap = {};
        for (let key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                let cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
                normalizedMap[cleanKey] = obj[key];
            }
        }
        for (let target of targetKeys) {
            let cleanTarget = target.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (normalizedMap[cleanTarget] !== undefined && normalizedMap[cleanTarget] !== null) {
                return String(normalizedMap[cleanTarget]).trim();
            }
        }
        return '';
    };
    </script>
    
    <style>
:root {
    --primary: #059669;
    --primary-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    
    --sakit-color: #0284c7;
    --sakit-bg: #e0f2fe;
    --izin-color: #d97706;
    --izin-bg: #fef3c7;
    --alpha-color: #e11d48;
    --alpha-bg: #ffe4e6;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; max-width: 480px; margin: 0 auto; padding-bottom: 20px; }

.view { display: none; }
.view.active { display: block !important; }

/* ANIMASI UI */
@keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.slide-up { animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.fade-in { animation: fadeIn 0.2s ease-in; }

/* TOP DECK HEADER & PROGRESS */
.top-deck { background: white; border-radius: 18px; padding: 12px 14px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 10px; }
.header-compact { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.avatar { background: var(--primary-gradient); color: white; width: 38px; height: 38px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 800; box-shadow: 0 4px 12px rgba(5,150,105,0.25); }

.progress-inline { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); }
.progress-bar-bg { flex: 1; background: #e2e8f0; height: 8px; border-radius: 10px; overflow: hidden; }
.progress-bar-fill { background: var(--primary); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }

/* CONTROLS ROW */
.controls-row { display: flex; gap: 6px; margin-bottom: 10px; }
.search-box-mini { flex: 1; position: relative; }
.search-box-mini input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: white; font-size: 12px; font-weight: 600; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.5; }

.filter-tabs { display: flex; gap: 4px; }
.tab-btn { padding: 8px 10px; border: 1px solid var(--border); background: white; border-radius: 10px; font-size: 10px; font-weight: 800; color: var(--text-muted); cursor: pointer; text-align: center; }
.tab-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); }

/* NEO-CARD SANTRI */
.santri-list { display: flex; flex-direction: column; gap: 8px; }
.santri-card { background: white; border-radius: 16px; padding: 12px 14px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 8px; transition: transform 0.15s; }
.santri-card:active { transform: scale(0.99); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.santri-nama { font-size: 13px; font-weight: 800; color: var(--text-main); line-height: 1.2; }
.santri-meta { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

.pills-group { display: flex; gap: 4px; align-items: center; margin-top: 2px; }
.pill-tag { padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; }
.pill-sakit { background: var(--sakit-bg); color: var(--sakit-color); }
.pill-izin { background: var(--izin-bg); color: var(--izin-color); }
.pill-alpha { background: var(--alpha-bg); color: var(--alpha-color); }

/* BADGES STATUS VERIFIKASI */
.badge-status { padding: 4px 8px; border-radius: 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
.badge-benar { background: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
.badge-koreksi { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
.badge-belum { background: #f1f5f9; color: #94a3b8; border: 1px solid var(--border); }

/* TOMBOL AKSI KARTU */
.card-actions { display: flex; gap: 6px; padding-top: 4px; border-top: 1px dashed #f1f5f9; }
.btn-act { flex: 1; padding: 7px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.15s; }
.btn-act:active { transform: scale(0.96); }

.btn-verify { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
.btn-edit-card { background: #f8fafc; color: var(--text-main); border: 1px solid var(--border); }

/* MODAL & CHIPS */
#modal-edit-koreksi { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 99999; align-items: flex-end; justify-content: center; }
.modal-content { background: white; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }

.modal-header { padding: 12px 16px; background: var(--primary-gradient); color: white; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

.section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

.chips-wrapper { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; min-height: 20px; }
.chip { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
.chip-sakit { background: var(--sakit-bg); color: var(--sakit-color); }
.chip-izin { background: var(--izin-bg); color: var(--izin-color); }
.chip-alpha { background: var(--alpha-bg); color: var(--alpha-color); }
.chip-del { cursor: pointer; opacity: 0.7; font-size: 11px; }

.quick-input-group { display: flex; gap: 6px; }
.quick-input-group input { width: 60px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-weight: 700; text-align: center; outline: none; }
.btn-add-chip { padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; color: white; }

/* LOGIN SCREEN */
#view-login { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #f8fafc; justify-content: center; align-items: center; padding: 16px; z-index: 99999; }
#view-login.active { display: flex !important; }
.login-card { background: white; padding: 24px 18px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); width: 100%; border: 1px solid var(--border); text-align: center; }
.alphabet-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
.alpha-btn { padding: 8px 0; background: #f1f5f9; border: none; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; color: var(--text-main); }
.alpha-btn.selected { background: var(--primary); color: white; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 8px 18px; border-radius: 25px; font-size: 11px; font-weight: 700; opacity: 0; transition: 0.25s; z-index: 999999; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    </style>
</head>
<body>

    <div id="toast" class="toast">Notifikasi</div>

    <!-- LOGIN MODAL -->
    <div id="view-login" class="view active">
        <div class="login-card slide-up">
            <div style="width: 48px; height: 48px; background: var(--primary-gradient); color: white; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; border-radius: 14px; margin: 0 auto 10px;" id="login-logo">?</div>
            <h2 style="font-size:16px; font-weight:800; color:var(--text-main);">Koreksi Absen</h2>
            <p style="color:var(--text-muted); font-size:11px; margin-bottom: 14px;">Pondok Pesantren Sidogiri</p>
            
            <p style="font-size:9px; font-weight:800; text-align:left; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase;">Pilih Daerah</p>
            <div class="alphabet-grid" id="alphabet-grid"></div>

            <div style="text-align:left; margin-bottom:14px;">
                <label style="font-size:9px; font-weight:800; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:4px;">Password</label>
                <input type="password" id="password" placeholder="Masukkan password..." style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:12px; outline:none;" oninput="document.getElementById('login-error').style.display='none'; this.style.borderColor='var(--border)';">
                <div id="login-error" style="color:#e11d48; font-size:11px; font-weight:800; margin-top:6px; display:none; text-align:left;"></div>
            </div>
            
            <button class="btn-act" style="background:var(--primary-gradient); color:white; width:100%; padding:12px; font-size:12px;" onclick="login()">Masuk Sistem ➔</button>
        </div>
    </div>

    <!-- VIEW UTAMA: KOREKSI ABSEN -->
    <div id="view-koreksi" class="view">
        <!-- COMPACT TOP DECK -->
        <div class="top-deck slide-up">
            <div class="header-compact">
                <div style="display:flex; gap:10px; align-items:center;">
                    <div class="avatar" id="nav-avatar">A</div>
                    <div>
                        <h3 style="font-size:13px; font-weight:800;">Daerah <span id="koreksi-daerah">A</span></h3>
                        <p style="font-size:10px; color:var(--text-muted); font-weight:600;" id="stat-progress-text">0 / 0 Santri Selesai</p>
                    </div>
                </div>
                <div style="display:flex; gap:4px;">
                    <button class="btn-act" style="background:#f1f5f9; color:var(--text-main);" onclick="fetchKoreksiDataRealtime()">🔄 Sync</button>
                    <button class="btn-act" style="background:#ffe4e6; color:var(--alpha-color);" onclick="logout()">Keluar</button>
                </div>
            </div>

            <div class="progress-inline">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
                <span style="font-size:11px; font-weight:800; color:var(--primary);" id="stat-percent">0%</span>
            </div>
        </div>

        <!-- SEARCH & FILTER ROW -->
        <div class="controls-row slide-up">
            <div class="search-box-mini">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-koreksi" placeholder="Cari Santri..." oninput="renderKoreksiList()">
            </div>
            <div class="filter-tabs">
                <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">Semua (<span id="count-all">0</span>)</button>
                <button class="tab-btn" id="tab-belum" onclick="setFilter('belum')">Belum (<span id="count-belum">0</span>)</button>
                <button class="tab-btn" id="tab-sudah" onclick="setFilter('sudah')">Selesai (<span id="count-sudah">0</span>)</button>
            </div>
        </div>

        <!-- LIST SANTRI CARDS -->
        <div class="santri-list slide-up" id="santri-list-container">
            <div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">Memuat data dari pusat...</div>
        </div>
    </div>

    <!-- MODAL EDIT KOREKSI ABSEN -->
    <div id="modal-edit-koreksi">
        <div class="modal-content slide-up">
            <div class="modal-header">
                <div>
                    <div style="font-size:9px; opacity:0.8; font-weight:800; text-transform:uppercase;">Edit Koreksi Santri</div>
                    <div style="font-size:14px; font-weight:800;" id="edit-nama">Nama Santri</div>
                </div>
                <button onclick="closeEditModal()" style="background:rgba(255,255,255,0.2); color:white; border:none; width:26px; height:26px; border-radius:50%; font-size:12px; font-weight:bold;">✕</button>
            </div>

            <div class="modal-body">
                <div style="font-size:11px; color:var(--text-muted); font-weight:600; background:#f1f5f9; padding:6px 10px; border-radius:8px;">
                    ID PPS: <b id="edit-pps" style="color:var(--text-main);">-</b> | Kamar: <b id="edit-domisili" style="color:var(--primary);">-</b>
                </div>

                <!-- ALPHA -->
                <div class="section-box">
                    <div class="section-title" style="color:var(--alpha-color);">
                        <span>Tanggal Alpha (A)</span>
                        <button onclick="addTodayDate('alpha')" style="font-size:9px; color:var(--alpha-color); background:var(--alpha-bg); padding:2px 6px; border-radius:4px; font-weight:800;">+ Hari Ini</button>
                    </div>
                    <div class="chips-wrapper" id="chips-alpha"></div>
                    <div class="quick-input-group">
                        <input type="number" id="input-add-alpha" min="1" max="31" placeholder="Tgl">
                        <button onclick="tambahTanggal('alpha')" class="btn-add-chip" style="background:var(--alpha-color);">+ Alpha</button>
                    </div>
                </div>

                <!-- IZIN -->
                <div class="section-box">
                    <div class="section-title" style="color:var(--izin-color);">
                        <span>Tanggal Izin (I)</span>
                        <button onclick="addTodayDate('izin')" style="font-size:9px; color:var(--izin-color); background:var(--izin-bg); padding:2px 6px; border-radius:4px; font-weight:800;">+ Hari Ini</button>
                    </div>
                    <div class="chips-wrapper" id="chips-izin"></div>
                    <div class="quick-input-group">
                        <input type="number" id="input-add-izin" min="1" max="31" placeholder="Tgl">
                        <button onclick="tambahTanggal('izin')" class="btn-add-chip" style="background:var(--izin-color);">+ Izin</button>
                    </div>
                </div>

                <!-- SAKIT -->
                <div class="section-box">
                    <div class="section-title" style="color:var(--sakit-color);">
                        <span>Tanggal Sakit (S)</span>
                        <button onclick="addTodayDate('sakit')" style="font-size:9px; color:var(--sakit-color); background:var(--sakit-bg); padding:2px 6px; border-radius:4px; font-weight:800;">+ Hari Ini</button>
                    </div>
                    <div class="chips-wrapper" id="chips-sakit"></div>
                    <div class="quick-input-group">
                        <input type="number" id="input-add-sakit" min="1" max="31" placeholder="Tgl">
                        <button onclick="tambahTanggal('sakit')" class="btn-add-chip" style="background:var(--sakit-color);">+ Sakit</button>
                    </div>
                </div>

                <div>
                    <label style="font-size:10px; font-weight:800; color:var(--text-muted); display:block; margin-bottom:4px;">KETERANGAN TAKLIMDA</label>
                    <input type="text" id="edit-ket" placeholder="Contoh: Haddam, Pulang, dll.." style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:11px; outline:none;">
                </div>

                <div style="display:flex; gap:6px; margin-top:4px;">
                    <button onclick="closeEditModal()" style="flex:1; padding:10px; background:#f1f5f9; color:var(--text-main); font-weight:800; border-radius:10px; font-size:12px;">Batal</button>
                    <button onclick="saveEditModal()" class="btn-act" style="background:var(--primary-gradient); color:white; flex:2; padding:10px; font-size:12px;">Simpan & Sync ➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1ecMJ8KBdbsNhuJCm_eYrRH2ATxZH7sn73GV-B19JoxKLNMrS8BCS8fZNnHBcqjM/exec";

    let currentUser = ""; 
    let masterKoreksi = [];
    let activeEditIndex = null;
    let activeFilter = 'all';
    let tempSakit = [], tempIzin = [], tempAlpha = [];

    document.addEventListener("DOMContentLoaded", () => {
        generateAlphabetGrid();
        checkSavedLogin();
    });

    function checkSavedLogin() {
        let savedDaerah = localStorage.getItem('taklimda_daerah');
        if (savedDaerah) {
            currentUser = savedDaerah;
            document.getElementById('nav-avatar').innerText = currentUser;
            document.getElementById('koreksi-daerah').innerText = currentUser;
            
            document.getElementById('view-login').classList.remove('active');
            document.getElementById('view-koreksi').classList.add('active');
            fetchKoreksiDataRealtime();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function fetchKoreksiDataRealtime() {
        showToast("Memuat data...");
        let container = document.getElementById('santri-list-container');

        try {
            let res = await fetch(APPS_SCRIPT_URL);
            let rawData = await res.json();

            if (!Array.isArray(rawData) || rawData.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">Data masih kosong.</div>`;
                return;
            }

            function parseDates(val) {
                if (Array.isArray(val)) return val.map(x => parseInt(x, 10)).filter(x => !isNaN(x));
                if (typeof val === 'number') return [val];
                if (typeof val === 'string' && val.trim()) {
                    return val.replace(/[/;]/g, ',').split(',').map(x => parseInt(x.trim(), 10)).filter(x => !isNaN(x));
                }
                return [];
            }

            let filtered = rawData.filter(r => {
                let dom = String(window.getValPeka(r, ['domisili', 'daerah', 'kamar', 'wilayah']) || '').toUpperCase().trim();
                let curr = String(currentUser || '').toUpperCase().trim();
                if (!curr) return true;
                return dom.startsWith(curr + '-') || dom.startsWith(curr + ' ') || dom.startsWith(curr) || dom.includes(curr);
            });

            masterKoreksi = filtered.map((r, i) => {
                let tAlpha = parseDates(window.getValPeka(r, ['tgl_alpha', 'tglalpha', 'tanggal_alpha', 'alpha']));
                let tIzin  = parseDates(window.getValPeka(r, ['tgl_izin', 'tglizin', 'tanggal_izin', 'izin']));
                let tSakit = parseDates(window.getValPeka(r, ['tgl_sakit', 'tglsakit', 'tanggal_sakit', 'sakit']));
                let statusK = window.getValPeka(r, ['status_koreksi', 'status', 'koreksi']) || 'Belum Dikoreksi';

                let isVerified = (statusK.toLowerCase().includes('sesuai') || statusK.toLowerCase().includes('benar') || statusK.toLowerCase().includes('sudah')) && !statusK.toLowerCase().includes('belum');

                return {
                    ...r,
                    _id: i,
                    _rowIndex: r._rowIndex,
                    _idPps: window.getValPeka(r, ['id_pps', 'idpps', 'id', 'nis']),
                    _nama: window.getValPeka(r, ['nama_santri', 'nama', 'namasantri', 'name']),
                    _domisili: String(window.getValPeka(r, ['domisili', 'daerah', 'kamar'])).toUpperCase(),
                    _jalsah: window.getValPeka(r, ['jalsah', 'kelompok', 'kelas']) || '-',
                    _tglAlphaArr: tAlpha,
                    _tglIzinArr: tIzin,
                    _tglSakitArr: tSakit,
                    _keterangan: window.getValPeka(r, ['keterangan_taklimda', 'keterangan', 'ket']) || '-',
                    _statusKoreksi: statusK,
                    _isDone: isVerified
                };
            });

            updateDashboardStats();
            renderKoreksiList();
            showToast(`Terhubung: ${masterKoreksi.length} Santri`);
        } catch(e) {
            console.error(e);
            showToast("Gagal mengambil data dari pusat!");
        }
    }

    function updateDashboardStats() {
        let total = masterKoreksi.length;
        let selesai = masterKoreksi.filter(x => x._isDone).length;
        let belum = total - selesai;
        let percent = total > 0 ? Math.round((selesai / total) * 100) : 0;

        document.getElementById('stat-progress-text').innerText = `${selesai} / ${total} Santri Selesai`;
        document.getElementById('stat-percent').innerText = `${percent}%`;
        document.getElementById('progress-bar-fill').style.width = `${percent}%`;

        document.getElementById('count-all').innerText = total;
        document.getElementById('count-belum').innerText = belum;
        document.getElementById('count-sudah').innerText = selesai;
    }

    function setFilter(filterType) {
        activeFilter = filterType;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${filterType}`).classList.add('active');
        renderKoreksiList();
    }

    function renderKoreksiList() {
        let container = document.getElementById('santri-list-container');
        let searchVal = document.getElementById('search-koreksi').value.toUpperCase().trim();
        container.innerHTML = "";

        let listToShow = masterKoreksi.filter(item => {
            let matchFilter = true;
            if (activeFilter === 'belum') matchFilter = !item._isDone;
            if (activeFilter === 'sudah') matchFilter = item._isDone;

            let matchSearch = true;
            if (searchVal) {
                let haystack = `${item._nama} ${item._idPps} ${item._domisili}`.toUpperCase();
                matchSearch = haystack.includes(searchVal);
            }

            return matchFilter && matchSearch;
        });

        if (listToShow.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">Tidak ada data santri.</div>`;
            return;
        }

        listToShow.forEach(item => {
            let st = item._statusKoreksi.toLowerCase();
            let badgeHtml = `<span class="badge-status badge-belum">Belum</span>`;
            
            if (st.includes('sesuai') || st.includes('benar')) {
                badgeHtml = `<span class="badge-status badge-benar">✔ Sesuai</span>`;
            } else if ((st.includes('sudah') || st.includes('dikoreksi')) && !st.includes('belum')) {
                badgeHtml = `<span class="badge-status badge-koreksi">✏ Dikoreksi</span>`;
            }

            let card = document.createElement('div');
            card.className = 'santri-card fade-in';

            card.innerHTML = `
                <div class="card-top">
                    <div>
                        <div class="santri-nama">${item._nama}</div>
                        <div class="santri-meta">ID: <b>${item._idPps}</b> • ${item._domisili}</div>
                    </div>
                    ${badgeHtml}
                </div>

                <div class="pills-group">
                    <span class="pill-tag pill-sakit">Sakit: ${item._tglSakitArr.length}</span>
                    <span class="pill-tag pill-izin">Izin: ${item._tglIzinArr.length}</span>
                    <span class="pill-tag pill-alpha">Alpha: ${item._tglAlphaArr.length}</span>
                </div>

                <div class="card-actions">
                    <button class="btn-act btn-verify" onclick="markAsSesuai(${item._id})">✔ Sesuai / Benar</button>
                    <button class="btn-act btn-edit-card" onclick="bukaModalKoreksi(${item._id})">✏ Edit Tanggal</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function markAsSesuai(index) {
        const item = masterKoreksi[index];
        if (!item) return;

        item._statusKoreksi = 'Sesuai (Benar)';
        item._isDone = true;

        showToast("Mengirim data ke pusat...");

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'updateKoreksi',
                data: {
                    _rowIndex: item._rowIndex,
                    tglSakit: item._tglSakitArr.join(', '),
                    tglIzin: item._tglIzinArr.join(', '),
                    tglAlpha: item._tglAlphaArr.join(', '),
                    keterangan: item._keterangan !== '-' ? item._keterangan : '',
                    status: 'Sesuai (Benar)'
                }
            })
        }).then(() => showToast("Data telah diperbarui"))
          .catch(err => console.error(err));

        updateDashboardStats();
        renderKoreksiList();
    }

    function generateAlphabetGrid() {
        const grid = document.getElementById('alphabet-grid');
        grid.innerHTML = "";
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
            let btn = document.createElement('button');
            btn.className = 'alpha-btn';
            btn.innerText = letter;
            btn.onclick = () => {
                document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentUser = letter;
                document.getElementById('login-logo').innerText = letter;
            };
            grid.appendChild(btn);
        });
    }

    async function login() {
        const passInput = document.getElementById('password').value.trim();
        const errDiv = document.getElementById('login-error');
        const passEl = document.getElementById('password');

        errDiv.style.display = 'none';
        passEl.style.borderColor = 'var(--border)';

        if (!currentUser) {
            errDiv.innerText = "⚠️ Pilih Abjad Daerah terlebih dahulu!";
            errDiv.style.display = 'block';
            showToast("Pilih Abjad Daerah dulu!");
            return;
        }
        if (!passInput) {
            errDiv.innerText = "⚠️ Masukkan password!";
            errDiv.style.display = 'block';
            passEl.style.borderColor = '#e11d48';
            showToast("Masukkan password!");
            return;
        }

        showToast("Memeriksa kata sandi...");

        try {
            let res = await fetch(APPS_SCRIPT_URL + "?action=getUsers");
            let users = await res.json();

            let foundUser = users.find(u => u.daerah === currentUser);
            let validPassword = foundUser ? foundUser.password : "Taklimda";

            if (passInput !== validPassword) {
                errDiv.innerText = "❌ Kata Sandi Salah!";
                errDiv.style.display = 'block';
                passEl.style.borderColor = '#e11d48';
                showToast("❌ Password Salah!");
                return;
            }

            localStorage.setItem('taklimda_daerah', currentUser);
            document.getElementById('nav-avatar').innerText = currentUser;
            document.getElementById('koreksi-daerah').innerText = currentUser;
            
            document.getElementById('view-login').classList.remove('active');
            document.getElementById('view-koreksi').classList.add('active');
            fetchKoreksiDataRealtime();

        } catch(err) {
            console.error(err);
            if (passInput === "Taklimda") {
                localStorage.setItem('taklimda_daerah', currentUser);
                document.getElementById('nav-avatar').innerText = currentUser;
                document.getElementById('koreksi-daerah').innerText = currentUser;

                document.getElementById('view-login').classList.remove('active');
                document.getElementById('view-koreksi').classList.add('active');
                fetchKoreksiDataRealtime();
            } else {
                errDiv.innerText = "❌ Kata Sandi Salah!";
                errDiv.style.display = 'block';
                passEl.style.borderColor = '#e11d48';
                showToast("Gagal verifikasi kata sandi!");
            }
        }
    }

    function logout() {
        localStorage.removeItem('taklimda_daerah');
        currentUser = "";
        document.getElementById('view-koreksi').classList.remove('active');
        document.getElementById('view-login').classList.add('active');
    }

    function bukaModalKoreksi(index) {
        activeEditIndex = index;
        const item = masterKoreksi[index];
        if (!item) return;

        tempSakit = [...(item._tglSakitArr || [])];
        tempIzin = [...(item._tglIzinArr || [])];
        tempAlpha = [...(item._tglAlphaArr || [])];

        document.getElementById('edit-nama').innerText = item._nama || '-';
        document.getElementById('edit-pps').innerText = item._idPps || '-';
        document.getElementById('edit-domisili').innerText = item._domisili || '-';
        document.getElementById('edit-ket').value = item._keterangan !== '-' ? item._keterangan : '';

        renderChips();
        document.getElementById('modal-edit-koreksi').style.display = 'flex';
    }

    function renderChips() {
        const setChips = (containerId, arr, type, chipClass) => {
            let el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = arr.length === 0 ? `<span style="font-size:10px; color:var(--text-muted);">Tidak ada</span>` :
                arr.map(tgl => `
                    <span class="chip ${chipClass}">
                        Tgl ${tgl}
                        <span class="chip-del" onclick="hapusTanggal('${type}', ${tgl})">✕</span>
                    </span>
                `).join('');
        };

        setChips('chips-alpha', tempAlpha, 'alpha', 'chip-alpha');
        setChips('chips-izin', tempIzin, 'izin', 'chip-izin');
        setChips('chips-sakit', tempSakit, 'sakit', 'chip-sakit');
    }

    function hapusTanggal(type, tgl) {
        if (type === 'alpha') tempAlpha = tempAlpha.filter(x => x !== tgl);
        if (type === 'izin') tempIzin = tempIzin.filter(x => x !== tgl);
        if (type === 'sakit') tempSakit = tempSakit.filter(x => x !== tgl);
        renderChips();
    }

    function tambahTanggal(type) {
        const inputId = type === 'alpha' ? 'input-add-alpha' : (type === 'izin' ? 'input-add-izin' : 'input-add-sakit');
        const el = document.getElementById(inputId);
        if (!el) return;
        const val = parseInt(el.value.trim(), 10);
        if (isNaN(val) || val < 1 || val > 31) return;

        tempAlpha = tempAlpha.filter(x => x !== val);
        tempIzin = tempIzin.filter(x => x !== val);
        tempSakit = tempSakit.filter(x => x !== val);

        if (type === 'alpha') tempAlpha.push(val);
        if (type === 'izin') tempIzin.push(val);
        if (type === 'sakit') tempSakit.push(val);

        el.value = '';
        renderChips();
    }

    function addTodayDate(type) {
        let today = new Date().getDate();
        tempAlpha = tempAlpha.filter(x => x !== today);
        tempIzin = tempIzin.filter(x => x !== today);
        tempSakit = tempSakit.filter(x => x !== today);

        if (type === 'alpha') tempAlpha.push(today);
        if (type === 'izin') tempIzin.push(today);
        if (type === 'sakit') tempSakit.push(today);

        renderChips();
    }

    function closeEditModal() {
        document.getElementById('modal-edit-koreksi').style.display = 'none';
    }

    function saveEditModal() {
        if (activeEditIndex === null || !masterKoreksi[activeEditIndex]) return;

        const item = masterKoreksi[activeEditIndex];
        item._tglSakitArr = tempSakit.sort((a,b)=>a-b);
        item._tglIzinArr = tempIzin.sort((a,b)=>a-b);
        item._tglAlphaArr = tempAlpha.sort((a,b)=>a-b);
        item._keterangan = document.getElementById('edit-ket').value.trim() || '-';
        item._statusKoreksi = 'Sudah Dikoreksi';
        item._isDone = true;

        showToast("Mengirim data ke pusat...");

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'updateKoreksi',
                data: {
                    _rowIndex: item._rowIndex,
                    tglSakit: item._tglSakitArr.join(', '),
                    tglIzin: item._tglIzinArr.join(', '),
                    tglAlpha: item._tglAlphaArr.join(', '),
                    keterangan: item._keterangan,
                    status: 'Sudah Dikoreksi'
                }
            })
        }).then(() => showToast("Data telah diperbarui"))
          .catch(err => console.error(err));

        closeEditModal();
        updateDashboardStats();
        renderKoreksiList();
    }
    </script>
</body>
</html>
